      <path d="M40 52 L40 170 Q40 180 50 180 L70 180"/>
      <path d="M40 52 L130 52 Q140 52 140 62 L140 72 Q140 82 150 82 L170 82"/>
      <path d="M170 82 L170 52 Q170 42 160 42 L90 42"/>
      <path d="M40 100 L80 100 Q90 100 90 110 L90 130 Q90 140 100 140 L130 140"/>
      <path d="M80 100 L110 100 Q120 100 120 90 L120 70"/>
      <path d="M40 130 L60 130 Q70 130 70 140 L70 160"/>
      <path d="M70 180 L100 180 Q110 180 110 170 L110 155"/>
      <path d="M110 155 L140 155 Q150 155 150 165 L150 180"/>
      <path d="M130 140 L130 120 Q130 110 140 110 L160 110"/>
      <path d="M160 110 L160 130"/>
    </g>
    
    <!-- Orange circuit nodes -->
    <g fill="#F59E0B">
      <circle cx="40" cy="52" r="5"/>
      <circle cx="90" cy="42" r="5"/>
      <circle cx="170" cy="52" r="4"/>
      <circle cx="170" cy="82" r="5"/>
      <circle cx="120" cy="70" r="4"/>
      <circle cx="80" cy="100" r="4"/>
      <circle cx="130" cy="140" r="5"/>
      <circle cx="160" cy="110" r="4"/>
      <circle cx="160" cy="130" r="4"/>
      <circle cx="70" cy="160" r="4"/>
      <circle cx="70" cy="180" r="5"/>
      <circle cx="110" cy="155" r="4"/>
      <circle cx="150" cy="180" r="5"/>
      <circle cx="40" cy="170" r="4"/>
